name: container-ghcr

# Fork-owned publisher for ghcr.io/<owner>/<repository>.
#
# container-publish.yml only runs from openai/codex-security on protected main
# with an immutable npm release tag and verified release artifacts, so it cannot
# publish a fork's source build. This workflow builds the current checkout with
# the same Dockerfile target that container-validate tests and pushes it to the
# calling repository's package.
#
# The build needs plugins/codex-security/native/prebuilt. That tree is ignored
# upstream and normally arrives from the native-artifacts workflow; this
# workflow instead ships the committed snapshot, because the fork builds on the
# free plan without arm64 native runners.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - package.json
      - sdk/typescript/**
      - plugins/codex-security/**
      - .github/workflows/container-ghcr.yml

permissions:
  contents: read

concurrency:
  group: container-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the vendored native payload is present
        shell: bash
        run: |
          set -euo pipefail
          expected=$(jq -r '.shippedExact[]
            | select(startswith("mcp/native/"))
            | sub("^mcp/native/"; "")' plugins/codex-security/plugin-files.json)
          test -n "$expected"
          while IFS= read -r path; do
            if [[ ! -f "plugins/codex-security/native/prebuilt/$path" ]]; then
              echo "Missing plugins/codex-security/native/prebuilt/$path." >&2
              exit 1
            fi
          done <<< "$expected"

      - name: Resolve image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(jq -er .version sdk/typescript/package.json)
          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'tags<<EOF\n%s:sha-%s\n%s:%s\n' "$image" "$GITHUB_SHA" "$image" "$version"
            if [[ $GITHUB_REF == "refs/heads/$GITHUB_DEFAULT_BRANCH" ]]; then
              printf '%s:latest\n' "$image"
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the scanner image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: scanner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Codex Security
            org.opencontainers.image.description=Codex Security scanner.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=codex-security-ghcr-amd64
          cache-to: type=gha,mode=max,scope=codex-security-ghcr-amd64

      - name: Verify the published image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          reference="$IMAGE@$DIGEST"
          test "$(docker run --rm "$reference" --version)" = "$VERSION"
          docker run --rm "$reference" bulk-scan --help > /dev/null
          test "$(docker run --rm --entrypoint id "$reference" -u)" = 10001
          docker logout ghcr.io
          {
            printf '### Published `%s`\n\n```\ndocker pull %s:%s\n```\n' \
              "$reference" "$IMAGE" "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
