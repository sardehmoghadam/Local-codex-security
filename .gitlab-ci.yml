# Build and publish the Codex Security scanner image to registry.local.com/risp.
#
# The job builds the scanner target of this repository's Dockerfile, adds curl in
# a derived image, and pushes two tags: the commit SHA and latest. It runs on the
# default branch, on tags, and on manual (web) runs from any branch.
#
# Registry: the pushes use no credentials. The daemon that pushes must trust the
# registry, so a plain-HTTP or self-signed registry has to be listed in that
# daemon's insecure-registries first (Docker Desktop: Settings, Docker Engine):
#   { "insecure-registries": ["registry.local.com"] }
#
# Runner: the Docker executor binds the host's Docker socket into the job, so the
# job runs docker against the host daemon. No docker:dind service, no
# DOCKER_HOST/TLS variables and no privileged mode:
#   [runners.docker]
#     volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
# The runner container itself must mount that socket as well.
#
# The build pulls node:26.12.1-bookworm-slim and the dockerfile frontend from
# Docker Hub, and packages need the npm registry.
#
# The scanner target intentionally has no curl; the upload step in
# examples/gitlab-ci does. The derived image keeps that step working, so
# registry.local.com/risp can be used as SCANNER_IMAGE without an overlay.

stages: [publish]

variables:
  IMAGE: registry.local.com/risp

publish-image:
  stage: publish
  image: docker:27-cli
  timeout: 1 hour
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      set -eu
      # Show the daemon this job talks to. A DOCKER_HOST left over from the
      # docker:dind setup points at a service host that does not exist.
      env | grep -i '^DOCKER_' || true
      docker version

      # Package this checkout and install it into the scanner image.
      docker build --target scanner --tag "$IMAGE:scanner-$CI_COMMIT_SHORT_SHA" .

      # Scanner image plus curl for the upload step in examples/gitlab-ci.
      build_dir="$(mktemp -d)"
      cat > "$build_dir/Dockerfile" <<EOF
      FROM $IMAGE:scanner-$CI_COMMIT_SHORT_SHA
      USER root
      RUN apt-get update && apt-get install --no-install-recommends --yes curl && rm -rf /var/lib/apt/lists/*
      USER 10001:10001
      EOF

      docker build --file "$build_dir/Dockerfile" \
        --tag "$IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$IMAGE:latest" \
        "$build_dir"
      rm -rf "$build_dir"

      docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$IMAGE:latest"
